<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ёбидоёби</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Nunito:wght@400;600;800&display=swap');

  :root {
    --red: #E8002D;
    --dark: #0a0a0a;
    --card: #141414;
    --border: #222;
    --text: #f0f0f0;
    --muted: #666;
    --gold: #FFD166;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--dark);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
  }

  .logo {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 900;
    font-size: 26px;
    color: var(--red);
    letter-spacing: -1px;
  }

  .logo span { color: var(--text); }

  .balance-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
  }

  .balance-bar b { color: var(--gold); font-size: 15px; }

  /* TABS */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    color: var(--muted);
  }

  .tab.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  /* SECTION */
  .section-title {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 20px;
    font-weight: 700;
    padding: 8px 16px 4px;
    color: var(--text);
  }

  /* MENU GRID */
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 8px 16px;
  }

  .item-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    position: relative;
  }

  .item-card.selected {
    border-color: var(--red);
  }

  .item-card:active { transform: scale(0.97); }

  .item-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
  }

  .item-info {
    padding: 8px 10px 10px;
  }

  .item-name {
    font-weight: 700;
    font-size: 13px;
    line-height: 1.3;
    margin-bottom: 6px;
  }

  .item-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .item-price {
    font-size: 13px;
    font-weight: 800;
    color: var(--gold);
  }

  .add-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--red);
    border: none;
    color: #fff;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, background 0.1s;
    flex-shrink: 0;
  }

  .add-btn.added {
    background: #333;
  }

  .qty-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--red);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.2s;
  }

  .qty-badge.visible {
    opacity: 1;
    transform: scale(1);
  }

  /* CART FOOTER */
  .cart-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 200;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--dark);
    border-top: 1px solid var(--border);
    display: none;
  }

  .cart-footer.visible { display: block; }

  .for-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }

  .for-btn {
    padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .for-btn.selected {
    border-color: var(--red);
    background: rgba(232,0,45,0.1);
    color: var(--text);
  }

  .order-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    background: var(--red);
    border: none;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: opacity 0.15s;
  }

  .order-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .order-btn .total { font-size: 14px; opacity: 0.85; }

  .spacer { height: 140px; }

  /* TOAST */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #222;
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Ёбидо<span>Ёби</span></div>
  <div class="balance-bar">
    💰 Субашичей: <b id="balanceDisplay">—</b>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div id="menuContainer"></div>

<div class="spacer"></div>

<div class="cart-footer" id="cartFooter">
  <div class="for-options">
    <button class="for-btn selected" id="forMe" onclick="setFor('me')">🙋 Себе домой</button>
    <button class="for-btn" id="forAll" onclick="setFor('all')">👨‍👩‍👧 Для всей группы</button>
  </div>
  <button class="order-btn" id="orderBtn" onclick="placeOrder()">
    <span>Заказать 🍣</span>
    <span class="total" id="totalDisplay">0 субашичей</span>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const MENU = [
  {
    category: "🔥 Горячие роллы",
    items: [
      { id: 1, name: "Ролл «Огненный дракон»", emoji: "🔥", price: 18 },
      { id: 2, name: "Темпура с лососем", emoji: "🍤", price: 15 },
      { id: 3, name: "Ролл «Вулкан»", emoji: "🌋", price: 20 },
      { id: 4, name: "Запечённый краб", emoji: "🦀", price: 22 },
    ]
  },
  {
    category: "🍣 Классические роллы",
    items: [
      { id: 5, name: "Филадельфия классик", emoji: "🥑", price: 14 },
      { id: 6, name: "Калифорния", emoji: "🦞", price: 12 },
      { id: 7, name: "Маки с огурцом", emoji: "🥒", price: 8 },
      { id: 8, name: "Нигири с тунцом", emoji: "🐟", price: 16 },
    ]
  },
  {
    category: "🍜 Горячее",
    items: [
      { id: 9,  name: "Рамен с курицей", emoji: "🍜", price: 20 },
      { id: 10, name: "Мисо-суп", emoji: "🥣", price: 7 },
      { id: 11, name: "Удон с говядиной", emoji: "🥩", price: 22 },
      { id: 12, name: "Гёдза жареные", emoji: "🥟", price: 11 },
    ]
  },
  {
    category: "🧋 Напитки",
    items: [
      { id: 13, name: "Матча латте", emoji: "🍵", price: 9 },
      { id: 14, name: "Bubble tea", emoji: "🧋", price: 10 },
      { id: 15, name: "Саке (холодное)", emoji: "🍶", price: 13 },
      { id: 16, name: "Лимонад юдзу", emoji: "🍋", price: 8 },
    ]
  },
  {
    category: "🍡 Десерты",
    items: [
      { id: 17, name: "Моти с манго", emoji: "🍡", price: 9 },
      { id: 18, name: "Чизкейк матча", emoji: "🍰", price: 12 },
      { id: 19, name: "Дайфуку", emoji: "🫧", price: 8 },
      { id: 20, name: "Мороженое васаби", emoji: "🍦", price: 10 },
    ]
  }
];

let cart = {}; // id -> qty
let forAll = false;
let userBalance = 0;

// Init
const initData = tg.initDataUnsafe;
userBalance = parseInt(initData?.start_param || "0") || 0;
document.getElementById("balanceDisplay").textContent = userBalance;

// Render tabs
const tabsEl = document.getElementById("tabs");
MENU.forEach((cat, i) => {
  const btn = document.createElement("button");
  btn.className = "tab" + (i === 0 ? " active" : "");
  btn.textContent = cat.category;
  btn.onclick = () => scrollToSection(i, btn);
  tabsEl.appendChild(btn);
});

// Render menu
const container = document.getElementById("menuContainer");
MENU.forEach((cat, ci) => {
  const section = document.createElement("div");
  section.id = `section-${ci}`;
  const title = document.createElement("div");
  title.className = "section-title";
  title.textContent = cat.category;
  section.appendChild(title);

  const grid = document.createElement("div");
  grid.className = "menu-grid";

  cat.items.forEach(item => {
    const card = document.createElement("div");
    card.className = "item-card";
    card.id = `card-${item.id}`;
    card.innerHTML = `
      <div class="item-img">${item.emoji}</div>
      <div class="qty-badge" id="badge-${item.id}">0</div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-footer">
          <div class="item-price">${item.price} 🪙</div>
          <button class="add-btn" id="btn-${item.id}" onclick="addItem(${item.id}, ${item.price}, '${item.name}')">+</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  section.appendChild(grid);
  container.appendChild(section);
});

function scrollToSection(i, tabBtn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  tabBtn.classList.add("active");
  document.getElementById(`section-${i}`).scrollIntoView({ behavior: "smooth" });
}

function addItem(id, price, name) {
  cart[id] = (cart[id] || 0) + 1;
  updateUI();
  showToast(`${name} добавлен(-а) ✓`);
}

function updateUI() {
  let total = 0;
  let count = 0;
  Object.entries(cart).forEach(([id, qty]) => {
    const item = findItem(parseInt(id));
    if (item) { total += item.price * qty; count += qty; }
    const badge = document.getElementById(`badge-${id}`);
    if (badge) {
      badge.textContent = qty;
      badge.classList.toggle("visible", qty > 0);
    }
  });

  const footer = document.getElementById("cartFooter");
  footer.classList.toggle("visible", count > 0);

  document.getElementById("totalDisplay").textContent = `${total} субашичей`;

  const btn = document.getElementById("orderBtn");
  btn.disabled = total > userBalance;
  if (total > userBalance) {
    document.getElementById("totalDisplay").textContent = `❌ не хватает`;
  }
}

function findItem(id) {
  for (const cat of MENU) {
    const item = cat.items.find(i => i.id === id);
    if (item) return item;
  }
  return null;
}

function setFor(mode) {
  forAll = mode === "all";
  document.getElementById("forMe").classList.toggle("selected", !forAll);
  document.getElementById("forAll").classList.toggle("selected", forAll);
}

function placeOrder() {
  const items = [];
  let total = 0;
  Object.entries(cart).forEach(([id, qty]) => {
    const item = findItem(parseInt(id));
    if (item) {
      items.push({ name: item.name, emoji: item.emoji, qty, price: item.price });
      total += item.price * qty;
    }
  });

  if (items.length === 0) return;
  if (total > userBalance) {
    showToast("❌ Недостаточно субашичей!");
    return;
  }

  const data = JSON.stringify({ items, total, forAll });
  tg.sendData(data);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}
</script>
</body>
</html>
